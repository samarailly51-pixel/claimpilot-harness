name: ClaimPilot Agent Safety

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claimpilot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ClaimPilot Harness
        run: python -m pip install claimpilot-harness

      - name: Run Agent safety benchmark
        run: claimpilot test

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: claimpilot-benchmark
          path: runs/claimpilot/
          if-no-files-found: error
