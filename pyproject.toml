[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claimpilot-harness"
version = "0.4.0"
description = "A crash-test harness for insurance claim AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ClaimPilot Harness contributors" }]
keywords = ["ai", "agents", "evals", "insurance", "llm", "testing", "red-team"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://samarailly51-pixel.github.io/claimpilot-harness/"
Repository = "https://github.com/samarailly51-pixel/claimpilot-harness"
Issues = "https://github.com/samarailly51-pixel/claimpilot-harness/issues"
Changelog = "https://github.com/samarailly51-pixel/claimpilot-harness/releases"

[project.scripts]
claimpilot = "claimpilot_harness.cli:main"

[tool.setuptools.packages.find]
include = ["claimpilot_harness*"]

[tool.setuptools.package-data]
claimpilot_harness = ["templates/*"]
